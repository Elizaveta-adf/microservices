services:

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  auth:
    build:
      context: ./auth_service
    container_name: auth
    environment:
      INSTANCE_NAME: auth
      PORT: 8000
      CONSUL_URL: http://consul:8500
      JWT_SECRET: lab-secret-key
    depends_on:
      - consul

  catalog-1:
    build:
      context: ./catalog_service
    container_name: catalog-1
    environment:
      INSTANCE_NAME: catalog-1
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      - consul

  catalog-2:
    build:
      context: ./catalog_service
    container_name: catalog-2
    environment:
      INSTANCE_NAME: catalog-2
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      - consul

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2