services:

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  auth:
    build:
      context: ./auth_service
    container_name: auth
    environment:
      INSTANCE_NAME: auth
      PORT: 8000
      CONSUL_URL: http://consul:8500
      JWT_SECRET: lab-secret-key
    depends_on:
      - consul

  catalog-1:
    build:
      context: ./catalog_service
    container_name: catalog-1
    environment:
      INSTANCE_NAME: catalog-1
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      - consul

  catalog-2:
    build:
      context: ./catalog_service
    container_name: catalog-2
    environment:
      INSTANCE_NAME: catalog-2
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      - consul

  orders:
      build:
        context: ./order_service
      container_name: orders
      environment:
        INSTANCE_NAME: orders
        PORT: 8000
        CONSUL_URL: http://consul:8500
      depends_on:
        - consul

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2

  graphql:
    build:
      context: ./graphql_gateway
    container_name: graphql
    environment:
      ORDERS_URL: http://orders:8000
      CATALOG_URL: http://catalog-1:8000
    depends_on:
      - orders
      - catalog-1
