services:

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  auth:
    build:
      context: ./auth_service
    container_name: auth
    environment:
      INSTANCE_NAME: auth
      PORT: 8000
      CONSUL_URL: http://consul:8500
      JWT_SECRET: lab-secret-key
    depends_on:
      - consul

  catalog-1:
    build:
      context: ./catalog_service
    container_name: catalog-1
    environment:
      INSTANCE_NAME: catalog-1
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      - consul

  catalog-2:
    build:
      context: ./catalog_service
    container_name: catalog-2
    environment:
      INSTANCE_NAME: catalog-2
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      - consul

  orders:
    build:
      context: ./order_service
    container_name: orders
    environment:
      INSTANCE_NAME: orders
      PORT: 8000
      CONSUL_URL: http://consul:8500
      RABBITMQ_HOST: rabbitmq
      KAFKA_SERVER: kafka:9092
    depends_on:
      - consul
      - rabbitmq
      - kafka

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2

  graphql:
    build:
      context: ./graphql_gateway
    container_name: graphql
    environment:
      ORDERS_URL: http://orders:8000
      CATALOG_URL: http://catalog-1:8000
    depends_on:
      - orders
      - catalog-1

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  payment:
    build:
      context: ./payment_service
    container_name: payment
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  notification:
    build:
      context: ./notification_service
    container_name: notification
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  payment-client:
    build:
      context: ./payment_client
    container_name: payment-client
    depends_on:
      - payment

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  analytics:
    build:
      context: ./analytics_service
    container_name: analytics
    environment:
      KAFKA_SERVER: kafka:9092
    depends_on:
      - kafka